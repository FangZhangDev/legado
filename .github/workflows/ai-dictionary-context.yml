name: AI Dictionary Context CI

on:
  push:
    branches:
      - ai-dictionary-context
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prepare assets and signing
        run: |
          echo "" > app/src/main/assets/18PlusList.txt
          cp .github/workflows/legado.jks app/legado.jks
          {
            echo "RELEASE_STORE_FILE=./legado.jks"
            echo "RELEASE_KEY_ALIAS=legado"
            echo "RELEASE_STORE_PASSWORD=gedoor_legado"
            echo "RELEASE_KEY_PASSWORD=gedoor_legado"
          } >> gradle.properties
          chmod +x gradlew

      - name: Run dictionary context contract test
        run: ./gradlew :app:testAppReleaseUnitTest --tests io.legado.app.ui.dict.DictReaderContextContractTest --stacktrace

      - name: Build installable ARM APK
        run: ./gradlew :app:assembleRelease -ParmOnly=true --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} apk/ \;
          ls -lh apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: legado-ai-dictionary-context-apk
          path: apk/*.apk
          if-no-files-found: error
